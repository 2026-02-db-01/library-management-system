services:
  db:
    image: postgres:16-alpine
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-library_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library_password}
      POSTGRES_DB: ${POSTGRES_DB:-library_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-library_user} -d ${POSTGRES_DB:-library_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-viewer:
    image: adminer:latest
    container_name: library-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    profiles: ["full"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서는 localhost 대신 서비스명(db)으로 접속
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-library_user}:${POSTGRES_PASSWORD:-library_password}@db:5432/${POSTGRES_DB:-library_db}
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: