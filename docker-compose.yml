# 백엔드 컨테이너 (선택). DB 는 여기서 띄우지 않는다.
# DB 는 database/ 폴더의 compose 로 먼저 실행한다 (스키마·시드·계정 권한이 거기서 만들어짐):
#   cd database && docker compose up -d
# 그 다음 루트에서:
#   docker compose --profile full up -d --build
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library-backend
    profiles: ["full"]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 127.0.0.1:5433 대신 database/ compose 네트워크의 db:5432 로 접속
      DATABASE_URL: postgresql+psycopg://library_app:${LIBRARY_APP_PASSWORD:?set LIBRARY_APP_PASSWORD in .env}@db:5432/library
    volumes:
      - ./backend/src:/app/src
    networks:
      - library_db

networks:
  library_db:
    # database/compose.yml (name: library) 가 만드는 기본 네트워크
    name: library_default
    external: true
