# compose.ssl.yml 에서만 쓰는 접속 규칙. 위에서부터 처음 맞는 줄이 적용되고, 맞는 줄이 없으면 거부된다.

# 컨테이너 안 (docker compose exec, 헬스체크, initdb, reset_demo.sql)
local      all      all                                         trust

# 외부 접속: SSL + 앱/조회 계정만, library DB 만
hostssl    library  library_app,library_readonly  0.0.0.0/0     scram-sha-256
hostssl    library  library_app,library_readonly  ::/0          scram-sha-256

# 그 외(SSL 없는 접속, postgres 슈퍼유저, 다른 DB)는 모두 거부
host       all      all                           0.0.0.0/0     reject
host       all      all                           ::/0          reject
