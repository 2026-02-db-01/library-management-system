# 도서관 DB 단독 컨테이너 (로컬 개발 = 서버 배포 동일 구성)
# 서버(/srv/stacks/library) 규칙에 맞춘 설정: pg16-alpine, mem_limit 160m, unless-stopped, 5433
# 실행: database/ 폴더에서  docker compose up -d
# 처음부터 다시(로컬 전용!): docker compose down -v ; docker compose up -d
#   initdb 스크립트는 볼륨이 비어 있을 때 한 번만 실행된다.
name: library

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 160m
    env_file: .env
    # 1 GB 서버용 축소 설정 (서버 템플릿과 동일)
    command: >
      postgres -c shared_buffers=48MB -c effective_cache_size=128MB
               -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=20
    volumes:
      - dbdata:/var/lib/postgresql/data
      # 파일 이름 앞 숫자 순서대로 실행된다.
      - ./initdb/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      # initdb 대상이 아닌 위치: 서버에서 데이터만 되돌릴 때 수동 실행 (down -v 금지 대신)
      - ./reset_demo.sql:/demo/reset_demo.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

volumes:
  dbdata:
